{% extends "base.html" %}
{% block title %}Overview{% endblock %}
{% block body %}
<h2 class="mb-3">{{ guild.name }}</h2>
<div class="row row-cards">
  {% for label, value, href in cards %}
  <div class="col-sm-6 col-lg-3"><a class="card card-link" href="{{ href }}"><div class="card-body">
    <div class="subheader">{{ label }}</div><div class="h1 mb-0">{{ value }}</div>
  </div></a></div>
  {% endfor %}
</div>
{% if not cards %}<p class="text-secondary">You are logged in, but nothing here is open to you yet.</p>{% endif %}
{% endblock %}
